name: Deploy PEFA Cathedral site

on:
  push:
    branches: [main, cursor/pefa-cathedral-website-4c6c]
    paths:
      - 'pefa-cathedral/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pefa-cathedral-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pefa-cathedral/package-lock.json
      - name: Build
        working-directory: pefa-cathedral
        env:
          VITE_BASE_PATH: /talanta/
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pefa-cathedral/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
